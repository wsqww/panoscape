name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只保留一次部署，新推送取消进行中的旧部署
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # 浏览器端密钥经仓库 Actions Secrets 注入（Settings → Secrets → Actions 配置）
          # 未配置时构建仍成功，运行时按留空逻辑降级（Esri 卫星源 / 720 云全景）
          VITE_TIANDITU_KEY: ${{ secrets.VITE_TIANDITU_KEY }}
          VITE_BAIDU_MAP_AK: ${{ secrets.VITE_BAIDU_MAP_AK }}

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # 自动启用 GitHub Pages（若仓库尚未开启）
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
